{% extends "base.html" %}
{% block title %}Projects{% endblock %}
{% block crumbs %}<span class="crumb current">Projects</span>{% endblock %}
{% block content %}
<div class="list">
{% for p in projects %}
  <a class="row" href="/p/{{ p.name }}">
    <div class="row-main">
      <span class="row-title">{{ p.label }}</span>
      <span class="muted mono">{{ p.cwd }}</span>
    </div>
    <div class="row-side">
      <span class="muted">{{ p.count }} session{{ '' if p.count == 1 else 's' }}</span>
      <span class="muted">{{ p.last.strftime('%-d %b %Y') }}</span>
    </div>
  </a>
{% endfor %}
</div>
{% endblock %}
