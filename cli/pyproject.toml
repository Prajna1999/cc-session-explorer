[project]
name = "commit-context"
version = "0.1.2"
description = "Attach Claude Code agent conversation context to git commits via git notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cc-commit-context = "commit_context.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commit_context"]
